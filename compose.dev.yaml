name: rumahpayung-dev

services:
  app:
    image: rumahpayung:${RELEASE_SHA:?set RELEASE_SHA to the full git sha}
    build:
      context: .
      args:
        RELEASE_SHA: ${RELEASE_SHA}
    init: true
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-/opt/rumahpayung-dev/runtime.env}
    ports:
      - '127.0.0.1:3101:3000'
    volumes:
      - ${DATA_DIR:-/opt/rumahpayung-dev/data}:/app/.local
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
